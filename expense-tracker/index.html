<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="/src/style.css" />
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <!-- Brand -->
            <div class="brand-section">

                <div class="brand-icon">
                    ₹
                </div>

                <h1>Expense Tracker</h1>

                <p>
                    Keep your expenses organized, wherever you are.
                </p>

            </div>


            <!-- Auth Tabs -->
            <div class="auth-tabs">

                <button
                    type="button"
                    id="loginTab"
                    class="auth-tab active">
                    Sign In
                </button>

                <button
                    type="button"
                    id="signupTab"
                    class="auth-tab">
                    Create Account
                </button>

            </div>


            <!-- ==================== LOGIN ==================== -->

            <form id="login-form" class="auth-form">

                <div class="form-heading">
                    <h2>Welcome back</h2>

                    <p>
                        Sign in to continue to your expenses.
                    </p>
                </div>


                <div class="form-group">

                    <label for="login-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required />

                </div>


                <div class="form-group">

                    <div class="label-row">

                        <label for="login-password">
                            Password
                        </label>

                        <button
                            type="button"
                            class="forgot-password">
                            Forgot password?
                        </button>

                    </div>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required />

                </div>


                <button
                    type="submit"
                    class="primary-auth-button">

                    <span>Sign In</span>

                </button>


                <p
                    id="login-message"
                    class="auth-message">
                </p>

            </form>


            <!-- ==================== SIGNUP ==================== -->

            <form
                id="signup-form"
                class="auth-form hidden">

                <div class="form-heading">

                    <h2>Create your account</h2>

                    <p>
                        Start managing your expenses today.
                    </p>

                </div>


                <div class="form-group">

                    <label for="signup-name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="signup-name"
                        placeholder="Your name"
                        autocomplete="name"
                        required />

                </div>


                <div class="form-group">

                    <label for="signup-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="signup-email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required />

                </div>


                <div class="form-group">

                    <label for="signup-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signup-password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required />

                </div>


                <button
                    type="submit"
                    class="primary-auth-button">

                    <span>Create Account</span>

                </button>


                <p
                    id="signup-message"
                    class="auth-message">
                </p>

            </form>


            <!-- Footer -->
            <div class="auth-footer">

                <p>
                    Your data is securely stored in the cloud.
                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="/src/main.js">
    </script>

</body>

</html>
